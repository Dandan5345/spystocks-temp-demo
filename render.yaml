services:
  - type: web
    name: spystocks-insider-explorer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONGRESS_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        value: "Information Check System doronenakache@gmail.com"
      - key: CIK_CACHE_HOURS
        value: "24"
      - key: CONGRESS_INDEX_CACHE_HOURS
        value: "24"
